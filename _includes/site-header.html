<header class="site-header">
  <div class="nav-wrapper">
    <a href="{{ '/' | relative_url }}" class="header-logo-compact">
      <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="PIE SIG Logo" height="42" style="max-height: 42px; width: auto;" onerror="this.style.display='none';">
    </a>

    <!-- Hamburger Toggle Button (Mobile Only) -->
    <button class="mobile-nav-toggle" aria-label="Toggle Navigation" onclick="document.querySelector('.main-nav').classList.toggle('is-open')">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>

    <nav class="main-nav">
      <a href="{{ '/' | relative_url }}" class="{% if page.url == '/' %}active{% endif %}">PIE SIG</a>
      <a href="{{ '/about/' | relative_url }}" class="{% if page.url == '/about/' %}active{% endif %}">ABOUT</a>
      <a href="{{ '/officers/' | relative_url }}" class="{% if page.url == '/officers/' %}active{% endif %}">MEET THE OFFICERS</a>
      <a href="{{ '/best-of-pie/' | relative_url }}" class="{% if page.url == '/best-of-pie/' %}active{% endif %}">BEST OF PIE SIG</a>
      <a href="{{ '/conferences/' | relative_url }}" class="{% if page.url == '/conferences/' %}active{% endif %}">CONFERENCES & EVENTS</a>
      <a href="{{ '/publications/' | relative_url }}" class="{% if page.url == '/publications/' %}active{% endif %}">PUBLICATIONS</a>
      <a href="{{ '/resources/' | relative_url }}" class="{% if page.url == '/resources/' %}active{% endif %}">RESOURCES</a>
    </nav>
  </div>
</header>
