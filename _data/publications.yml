# 3. PERFORMANCE IN EDUCATION REVIEW
pie_review:
  description: >-
    Some of PIE SIG’s amazing conference presenters have been kind enough to write scholarly articles on
    their presentations, workshops, and performances. The Performance in Education Review presents some of
    these notable articles previously presented at PIE SIG conferences. The intention of this journal is
    to create a montage of the year in PIE conferences, but some volumes may cover multiple years due to the
    time needed to gather all proposals.
  submission_guidelines_url: "https://jalt-publications.org/tlt/submissions"
  contact_email: "head.philip@gmail.com"
  contact_person: "Philip Head"
  publisher_info: "Published by the Performance in Education Special Interest Group, The Japan Association for Language Teaching, JALT Central Office, Urban Edge Bldg 5F, 1-37-9 Taito, Taito-ku, Tokyo."
  volumes:
    - volume: "Volume 1 (2020)"
      pdf: "/assets/publications/pie-review/Performance-in-Education-Review-2020.pdf"
      sections:
        - category: "EDITORIAL"
          items:
            - title: "From the Editors"
              page: "p. 3"

        - category: "INTERVIEWS"
          items:
            - title: "Interview 1: Interview with Rod Ellis on Performance Assisted Learning (Reprint)"
              author: "David Kluge"
              page: "pp. 9–21"
            - title: "Interview 2: Interview with Rod Ellis on Performance Assisted Learning, Part 2 (Reprint)"
              author: "David Kluge"
              page: "pp. 22–37"

        - category: "CONTENT"
          items:
            - title: "The Māori Haka: Understanding Culture Through Traditional Performance"
              author: "Matthew Cotter"
              page: "pp. 39–48"
            - title: "Active, Creative, Collaborative Learning Through Performance Activities Deepens Connections to Art History Class Content in Japan"
              author: "Will Hall"
              page: "pp. 49–68"

        - category: "PERFORMANCE"
          items:
            - title: "“Nanzan Bossa”: A Spontaneous Musical Encounter in Nagoya"
              author: "Kim Rockell, Vivian Bussinguer-Khavari"
              page: "pp. 70–79"
            - title: "Musical Integration in the Language Classroom"
              author: "Chelsea Schwartz"
              page: "pp. 80–82"
            - title: "Star-Crossed Lovers: The “Given and Added” in the Magic of an English Noh Performance"
              author: "Kim Rockell"
              page: "pp. 83–101"

        - category: "PRESENTATION"
          items:
            - title: "PowerPoint as a “Modified Teleprompter”"
              author: "James Higa"
              page: "pp. 103–118"

        - category: "RESEARCH"
          items:
            - title: "Dance the Data! Matching Form with Content in Presenting Performance in Education Research"
              author: "David Kluge"
              page: "pp. 108–119"
            - title: "The Relationship Between University Students’ Global Self-Esteem and Foreign Language Self-Esteem"
              author: "Takanori Omura"
              page: "pp. 120–138"

        - category: "ABOUT THE SIG"
          items:
            - title: "Introducing the Performance in Education SIG"
              page: "p. 139"