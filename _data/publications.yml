# 1. MASK & GAVEL
mask_and_gavel:
  issn: "2435-6603"
  description: >
    Mask & Gavel is the peer-reviewed academic journal of the Performance in Education SIG.
    Article submissions are accepted year-round and published online as soon as they are finalized,
    before being collected into the full journal published online bi-annually. All articles are
    vetted by an editor, blinded, and peer-reviewed by two reviewers before publication. We welcome
    research-based, comment & opinion, interview, and review-based articles. Practical lesson resource
    articles should be submitted to the Classroom Resources journal. For submission guidelines please refer
    to the specifications outlined in The Language Teacher.
  submission_guidelines_url: "https://jalt-publications.org/tlt/submissions"
  contact_email: "piesigpublications@gmail.com"
  contact_person: "Philip Head"
  publisher_info: "Published by the Performance in Education Special Interest Group, The Japan Association for Language Teaching, JALT Central Office, Urban Edge Bldg 5F, 1-37-9 Taito, Taito-ku, Tokyo."
  volumes: [] # We will populate this with your 11 volumes later

# 2. PIE SIG CLASSROOM RESOURCES JOURNAL
classroom_resources:
  issn: "2435-676X"
  description: >
    The classroom resource journal of the Performance in Education SIG. PIE SIG has put together a new
    lesson resource online publication, and it is now available online. This is the publication for the
    sharing of practical lesson resources. For the classroom resource journal submission style, use JALT’s
    My Share column guidelines.
  submission_guidelines_url: "https://jalt-publications.org/tlt/submissions"
  contact_email: "head.philip@gmail.com"
  contact_person: "Philip Head"
  publisher_info: "Published by the Performance in Education Special Interest Group, The Japan Association for Language Teaching, JALT Central Office, Urban Edge Bldg 5F, 1-37-9 Taito, Taito-ku, Tokyo."
  volumes: [] # We will populate this with your 2 volumes later

# 3. PERFORMANCE IN EDUCATION REVIEW
pie_review:
  description: >
    Some of PIE SIG’s amazing conference presenters have been kind enough to write scholarly articles on
    their presentations, workshops, and performances. The Performance in Education Review presents some of
    these notable articles previously presented at PIE SIG conferences. The intention of this journal is
    to create a montage of the year in PIE conferences, but some volumes may cover multiple years due to the
    time needed to gather all proposals.
  submission_guidelines_url: "https://jalt-publications.org/tlt/submissions"
  contact_email: "head.philip@gmail.com"
  contact_person: "Philip Head"
  publisher_info: "Published by the Performance in Education Special Interest Group, The Japan Association for Language Teaching, JALT Central Office, Urban Edge Bldg 5F, 1-37-9 Taito, Taito-ku, Tokyo."
  volumes: [] # We will populate this when you have volume data

