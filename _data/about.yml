what_we_are:
  - title: "We are Dramatic."
    text: "One focus of the SIG is drama, and many members have theatre backgrounds or an interest in theatre. Yes, we do put on plays, radio dramas, and readers theatre productions in our schools, but we also incorporate into our classes roleplays, simulations, theatre games, improv activities, and process drama techniques. Never heard of process drama? It can enhance EFL classes in many ways. Ask one of our members to explain it to you personally or at a chapter meeting."
  - title: "We are Creative."
    text: "It is amazing how many creative, artistic people we meet whenever we gather together. If there were a group equivalent to Mensa for creative people, we would be a chapter of that group."
  - title: "We are Flamboyant."
    text: "Not all of us, but a great many of us dress in flamboyant colors (guilty as charged) and talk and gesture dramatically. We can't help it—it is like we are living in the \"Bohemian Rhapsody\" world. That is also how we teach. Students are not bored in our classes!"
  - title: "We are Argumentative."
    text: "Debate is another focus of the SIG and it is interesting how many of the flamboyant, dramatic people are also the debate people. Formal debate teaches important critical thinking and public speaking skills, but it is also exciting and fun, and the way we teach it is fun, yet challenging. Students are not bored in these classes, either."
  - title: "We are Orators."
    text: "We teach speech and presentation, and we are unusually good orators. At SIG forums at PanSIG or the JALT international conference, I am amazed at the consistently excellent quality of speakers in the SIG."
  - title: "We are Serious Professionals."
    text: "In addition to being good teachers, we also write articles, textbooks, and performance pieces, we conduct research, we go to great lengths to mentor the younger members, we volunteer in the JALT organization, and we make it a point to go to conferences to spread the word about the value of performance in the learning process."

what_we_do:
  - title: "Publication Producer"
    text: "<em>Mask & Gavel</em> is our official peer-reviewed journal that comes out once a year. And the <em>PIE SIG Classroom Resources Journal</em>, which is a collection of My Share-type articles, comes out whenever we accumulate a sufficient number of articles."
  - title: "News Station"
    text: "Current news about events relevant to our SIG or involving SIG members is announced to members and interested people on our social media."
  - title: "Event Producer"
    text: "In our first year, we produced our biggest event when we co-sponsored with Oxford University Press to bring Carolyn Graham (of Jazz Chants fame) and Ken Wilson (improv and Smart Choice) to Nagoya. We have co-sponsored with OUP to have Ken Wilson present at our events four times in the last seven years."
  - title: "Presentation Agent"
    text: "We have been asked to provide presenters at several JALT chapters and have even produced one-day mini-conferences for chapters. Please contact us if you are interested in presenting at or sponsoring a PIE SIG/chapter mini-conference."
  - title: "Conference Sponsor"
    text: "Every year we sponsor our own conference(s). They have been member-friendly—our 2018 Travelling Conference set up the big tent in the Kansai, Tokai, and Kanto areas to bring the conference to members who do not have institutional financial support to travel to conferences. Conferences have been held in Okinawa, Sapporo, and Nagoya."
  - title: "Club & Networking"
    text: "Although a small SIG, our networking dinners sometimes feature close to half of our total membership! These events are serious, loud, raucous, humorous, and most of all, a family gathering. Both Apollo and Dionysus are members of our SIG."
  - title: "Podcast"
    text: "The PIE SIG Podcast is a monthly show featuring conversations with educators working in performance-based teaching, both within PIE, across other SIGs, and beyond the PIE sphere. Since its launch in July 2025, it has reached a growing audience and provides practical classroom approaches."